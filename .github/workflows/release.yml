# Push a tag like v0.1.0 to publish binaries the Zed extension can download.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-latest,   target: aarch64-apple-darwin }
          # GitHub retired its Intel macOS runners; Apple Silicon ones cross-compile.
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a ../../../antora-ls-${{ matrix.target }}.zip antora-ls.exe
          else
            tar czf ../../../antora-ls-${{ matrix.target }}.tar.gz antora-ls
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: antora-ls-${{ matrix.target }}.*
